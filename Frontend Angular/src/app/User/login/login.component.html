<div class="login-container">
  <h2>Login</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <i class="fas fa-envelope"></i>
      <input type="email" placeholder="Email address" formControlName="email" required />
    </div>
    <div class="form-group">
      <i class="fas fa-lock"></i>
      <input type="password" placeholder="Password" formControlName="password" required />
    </div>
    <a class="forgot" routerLink="/forget-password">Forgot your password?</a>
    <button class="btn-primary" type="submit">Sign In</button>
      <div *ngIf="message" class="success">{{ message }}</div>
    <div *ngIf="error" class="error">{{ error }}</div>
  </form>

  <div class="divider">or</div>

<button type="button" class="btn-google" (click)="loginWithGoogle()">
    <img
      src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
      alt="Google"
    />
    Continue with Google
  </button>

  <p class="signup-link">
    Don't have an account?
    <a routerLink="/inscription">Create an account</a>
  </p>
</div>
