<div class="profile-container" *ngIf="user">
  <div class="profile-card">
    <!-- Header -->
    <div class="profile-header">
      <div class="profile-photo" *ngIf="user.photoBase64">
        <img [src]="user.photoBase64" alt="Photo de profil" class="profile-image" />
      </div>
      <div class="profile-info">
        <h2>{{ user.firstname }} {{ user.lastname }}</h2>
        <p><strong>Email:</strong> {{ user.email }}</p>
        <p><strong>Gender:</strong> {{ user.sexe }}</p>
      </div>
    </div>

    <!-- Upload image -->
    <div class="profile-upload">
      <label for="fileInput">📤 Upload profile image:</label>
      <input type="file" id="fileInput" (change)="onFileSelected($event)" accept="image/*" />
    </div>

    <!-- Formulaire -->
    <form (ngSubmit)="saveProfile()">
      <div class="form-grid">
        <div class="form-group">
          <label for="firstname">First Name:</label>
          <input id="firstname" type="text" [(ngModel)]="user.firstname" name="firstname" />
        </div>

        <div class="form-group">
          <label for="lastname">Last Name:</label>
          <input id="lastname" type="text" [(ngModel)]="user.lastname" name="lastname" />
        </div>

        <div class="form-group">
          <label for="email">Email:</label>
          <input id="email" type="email" [(ngModel)]="user.email" name="email" disabled />
        </div>

        <div class="form-group">
          <label for="sexe">Gender:</label>
          <select id="sexe" [(ngModel)]="user.sexe" name="sexe">
            <option value="Homme">Homme</option>
            <option value="Femme">Femme</option>
          </select>
        </div>

        <div class="form-group">
          <label for="dateOfBirth">Date of Birth:</label>
          <input id="dateOfBirth" type="date" [(ngModel)]="user.dateOfBirth" name="dateOfBirth" />
        </div>

        <div class="form-group">
          <label for="phoneNumber">Phone Number:</label>
          <input id="phoneNumber" type="tel" [(ngModel)]="user.phoneNumber" name="phoneNumber" />
        </div>

        <div class="form-group">
          <label for="address">Address:</label>
          <input id="address" type="text" [(ngModel)]="user.address" name="address" />
        </div>

        <div class="form-group">
          <label for="city">City:</label>
          <input id="city" type="text" [(ngModel)]="user.city" name="city" />
        </div>

        <div class="form-group">
          <label for="country">Country:</label>
          <input id="country" type="text" [(ngModel)]="user.country" name="country" />
        </div>

        <div class="form-group">
          <label for="biography">Biography:</label>
          <textarea id="biography" [(ngModel)]="user.biography" name="biography" rows="3"></textarea>
        </div>
      </div>

      <button type="submit">Save Changes</button>
    </form>
  </div>
</div>
