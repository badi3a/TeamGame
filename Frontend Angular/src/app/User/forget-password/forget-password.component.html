<div class="reset-container">
  <h2>Password Reset</h2>

  <div *ngIf="step === 1">
    <input [(ngModel)]="email" placeholder="Email" type="email" />
    <button (click)="sendCode()">Send Code</button>
  </div>

  <div *ngIf="step === 2">
    <input [(ngModel)]="code" placeholder="Code received by email" />
    <button (click)="verifyCode()">Verify Code</button>
  </div>

  <div *ngIf="step === 3">
    <input [(ngModel)]="newPassword" placeholder="New Password" type="password" />
    <button (click)="resetPassword()">Reset Password</button>
  </div>

  <div *ngIf="step === 4">
    <p class="success">Password successfully changed!</p>
  </div>

  <p *ngIf="message" class="error">{{ message }}</p>
</div>
